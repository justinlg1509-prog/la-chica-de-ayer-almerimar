<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · La Chica de Ayer</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0706">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/webp" href="images/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Archivo:wght@300;400&display=swap" rel="stylesheet">
<style>
  .err{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem var(--gutter);gap:.4rem}
  .err img{height:72px;width:auto;border-radius:8px;margin-bottom:2rem}
  .err .code{font-family:var(--display);font-style:italic;color:var(--amber);font-size:clamp(3.4rem,12vw,7rem);line-height:1}
  .err h1{font-family:var(--display);font-weight:300;font-size:clamp(1.5rem,4vw,2.6rem);line-height:1.15;margin:.6rem 0 1rem;max-width:22ch}
  .err p{color:var(--bone-dim);max-width:44ch;font-size:1rem}
  .err .cta-row{margin-top:2.4rem}
</style>
</head>
<body>
<main class="err">
  <img src="images/logo.webp" alt="La Chica de Ayer" width="144" height="72">
  <span class="code">404</span>
  <h1>Esta noche no está en la carta.</h1>
  <p>La página que buscas ya no existe o nunca llegó a abrir. Vuelve a la barra y seguimos donde lo dejamos.</p>
  <div class="cta-row">
    <a href="/" class="btn btn-primary">Volver al inicio</a>
    <a href="/#contacto" class="btn btn-ghost">Cómo llegar</a>
  </div>
</main>
</body>
</html>
